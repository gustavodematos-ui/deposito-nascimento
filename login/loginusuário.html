<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEPÓSITO NASCIMENTO BD - Login de Cliente</title>
    <!-- Ligação com o CSS separado -->
    <link rel="stylesheet" href="conta.css">
</head>
<body>

    <div class="login-card">
        <!-- Cabeçalho / Logótipo -->
        <div class="header-box">
            DEPÓSITO NASCIMENTO:
        </div>

        <h2>Acesse a sua conta:</h2>

        <!-- Formulário de Login -->
        <form action="#" method="POST" class="form-group">
            <div class="form-content">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite o seu e-mail" required>
            </div>

            <div class="form-content">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite a sua senha" required>
            </div>

            <div class="btn-container">
                <button type="submit">Entrar</button>
            </div>
            
            <div class="register-link">
                <p>Ainda não tem conta? <a href="cadastroclientes.html">Registe-se aqui</a></p>
            </div>
        </form>
    </div>

    <!-- Link para voltar ao site principal -->
    <div class="back-home">
        <a href="../site.html">Voltar ao Catálogo</a>
    </div>

</body>
</html>
