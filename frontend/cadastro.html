<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depósito Nascimento - Cadastrar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="body-center">

  <div class="content-card register-card">
    <div class="header-banner">
      DEPÓSITO NASCIMENTO BD
    </div>

    <h2 class="form-title">Cadastrar</h2>

    <form action="#" method="POST">
      <div class="form-group mb-14">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo">
      </div>

      <div class="form-group mb-14">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com">
      </div>

      <div class="form-group mb-14">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha">
      </div>

      <div class="form-group mb-20">
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha">
      </div>

      <button type="submit" class="btn-primary btn-submit">Cadastrar</button>
    </form>

    <a href="login.html" class="login-link">Já possui uma conta? Entrar.</a>
  </div>

</body>
</html>
