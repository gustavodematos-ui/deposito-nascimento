<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depósito Nascimento - Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">Depósito Nascimento</div>
    <span class="logo-sub">BD</span>
  </div>
  
  <nav class="sidebar-nav">
    <div class="nav-header">Navegação</div>
    
    <a href="produtos.html" class="nav-item">
      Produtos
    </a>
    <a href="pedidos.html" class="nav-item active">
      Pedidos
    </a>
    <a href="estoque.html" class="nav-item">
      Estoque
    </a>
    <a href="forma-pagamento.html" class="nav-item">
      Forma de Pagamento
    </a>
    <a href="reposicao.html" class="nav-item">
      Reposição
    </a>
  </nav>

  <div class="sidebar-user">
    <div class="user-role">Administrador</div>
  </div>
</aside>

<main class="main">
  <!-- Seção Pedidos -->
  <div class="section-card">
    <h2>Pedidos</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>--Pedido--</th>
            <th>--Cliente--</th>
            <th>--Valor--</th>
            <th>--Status--</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#001</td>
            <td>Cliente Exemplo</td>
            <td>R$ 100,00</td>
            <td><span class="badge badge-blue">Pendente</span></td>
            <td>
              <button class="btn-primary btn-sm">ver detalhes</button>
              <button class="btn-primary btn-sm">Atualizar status</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Seção Vendas -->
  <div class="section-card">
    <h2>Vendas</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>--Data--</th>
            <th>--Pedido--</th>
            <th>--Produtos--</th>
            <th>--Quantidade--</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>20/09/2026</td>
            <td>#001</td>
            <td>Produto Exemplo</td>
            <td>2</td>
            <td>
              <button class="btn-primary btn-sm">ver detalhes</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="../backend/src/app.js"></script>
</body>
</html>
